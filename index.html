<!doctype html>
<html lang="de" data-site>
  <head>
    <meta charset="utf-8">
    <meta name="generator" content="Dashboard 2.39.0 (npm run build:site)">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Meine Kinothek">
    <title>Meine Kinothek</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <script src="js/site/boot.js" data-intro data-gate></script>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/link-transition.css">
    <link rel="stylesheet" href="css/curtain.css">
    <link rel="stylesheet" href="css/universe.css">
    <link rel="stylesheet" href="css/tonight.css">
    <link rel="stylesheet" href="css/film-year.css">
    <link rel="stylesheet" href="css/duel.css">
    <link rel="stylesheet" href="css/site.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Zum Inhalt springen</a>

    <div class="curtain curtain--left" aria-hidden="true"><div class="curtain-fabric"></div></div>
    <div class="curtain curtain--right" aria-hidden="true"><div class="curtain-fabric"></div></div>
    <div class="corner-decor" id="corner-decor" aria-hidden="true"></div>

    <header class="appbar">
      <div class="appbar-inner">
        <a class="brand brand--medallion" href="index.html" aria-label="Meine Kinothek – Startseite">
          <img src="assets/logo.svg" alt="" width="150" height="150" decoding="async">
          <span class="brand-fallback" aria-hidden="true">Meine Kinothek</span>
        </a>
        <div class="appbar-actions">
          <label class="visually-hidden" for="theme-select">Design</label>
          <select id="theme-select" class="compact">
            <option value="system">System</option>
            <option value="light">Hell</option>
            <option value="dark">Dunkel</option>
          </select>
          <button class="button quiet" id="view-button" type="button">Ansicht</button>
        </div>
      </div>
    </header>

    <main class="shell" id="main">
      <div class="page-head">
        <div class="page-head-text">
          <h1 id="site-title">Meine Kinothek</h1>
          <p class="meta" aria-live="polite"><span id="collection-count">Wird geladen …</span><span id="collection-stand" class="stand"></span></p>
        </div>
      </div>

      <figure class="quote-of-day" id="quote-of-day" hidden>
        <blockquote class="quote-text"></blockquote>
        <figcaption class="quote-source"></figcaption>
      </figure>

      <div class="view-tabs" role="tablist" aria-label="Entertainment-Ansicht">
        <button class="view-tab" type="button" id="tab-titles" role="tab"
                aria-selected="true" aria-controls="titles-panel">Titel</button>
        <button class="view-tab" type="button" id="tab-timeline" role="tab"
                aria-selected="false" tabindex="-1" aria-controls="timeline-panel">Zeitleiste</button>
        <button class="view-tab" type="button" id="tab-universe" role="tab"
                aria-selected="false" tabindex="-1" aria-controls="universe-panel">Filmuniversum</button>
        <button class="view-tab" type="button" id="tab-stats" role="tab"
                aria-selected="false" tabindex="-1" aria-controls="stats-panel">Heute</button>
        <button class="view-tab" type="button" id="tab-year" role="tab"
                aria-selected="false" tabindex="-1" aria-controls="year-panel">Filmjahr</button>
        <button class="view-tab" type="button" id="tab-duel" role="tab"
                aria-selected="false" tabindex="-1" aria-controls="duel-panel">Ich gegen IMDb</button>
      </div>

      <!-- Suche, Filter und Sortierung gelten für „Titel", „Zeitleiste", „Filmuniversum" und „Du gegen IMDb" (dort ohne Sortierung) -->
      <div class="entertainment-controls" id="entertainment-controls">
        <div class="search-row">
          <label class="visually-hidden" for="movie-search">Entertainment durchsuchen</label>
          <input class="search" id="movie-search" placeholder="Nach Titel, Person oder Genre suchen">
        </div>

        <div class="toolbar-row" id="toolbar-row" hidden>
          <div class="filter-chips" id="filter-chips" role="group" aria-label="Filter" tabindex="-1"></div>
          <div class="sort-field">
            <label class="visually-hidden" for="movie-sort">Sortieren nach</label>
            <select id="movie-sort" class="compact"></select>
            <button type="button" class="sort-dir" id="movie-sort-dir"></button>
          </div>
          <!-- Nur in der Zeitleiste sichtbar (anstelle der Sortierung) -->
          <div class="timeline-mode" role="radiogroup" aria-label="Zeitpunkt auf der Zeitleiste">
            <button type="button" class="timeline-mode-option" role="radio" data-timeline-mode="release" aria-checked="false" tabindex="-1">Erschienen</button>
            <button type="button" class="timeline-mode-option" role="radio" data-timeline-mode="rated" aria-checked="true">Bewertet</button>
          </div>
          <!-- Nur im Filmuniversum sichtbar (anstelle der Sortierung) -->
          <div class="universe-mode" role="radiogroup" aria-label="Welche Titel">
            <button type="button" class="timeline-mode-option" role="radio" data-universe-mode="rated" aria-checked="true">Bewertet</button>
            <button type="button" class="timeline-mode-option" role="radio" data-universe-mode="all" aria-checked="false" tabindex="-1">Ganze Kinothek</button>
          </div>
        </div>

      </div>

      <section id="titles-panel" role="tabpanel" aria-labelledby="tab-titles" tabindex="0">
        <div id="movies-grid" class="movie-grid spaced"></div>
      </section>

      <section id="timeline-panel" class="timeline-panel" role="tabpanel" aria-labelledby="tab-timeline" hidden tabindex="-1">
        <div class="coverflow" id="coverflow" tabindex="0" role="group" aria-roledescription="Cover Flow"
             aria-label="Titel nach Zeit" aria-describedby="timeline-help"></div>
        <div class="timeline-info" id="timeline-info" aria-live="polite"></div>
        <div class="timeline-axis" id="timeline-axis">
          <svg aria-hidden="true" focusable="false"></svg>
          <div class="timeline-peek" id="timeline-peek" hidden></div>
        </div>
        <p class="timeline-foot">
          <span><span id="timeline-count" aria-live="polite"></span><span id="timeline-missing"></span></span>
          <span id="timeline-help">← → blättern · Enter zeigt den Abstand · Strich anklicken springt dorthin</span>
        </p>
      </section>

      <!-- „Filmuniversum": Genres als Galaxien, Titel und Menschen als Sterne (js/ui/universe.js) -->
      <section id="universe-panel" class="universe-panel" role="tabpanel" aria-labelledby="tab-universe" hidden tabindex="-1"></section>

      <section id="stats-panel" class="tonight-panel" role="tabpanel" aria-labelledby="tab-stats" hidden tabindex="0">
        <div class="stats-tile">
          <div class="stats-numbers" id="stats-numbers" aria-live="polite"></div>
          <div class="stats-progress" id="stats-progress" hidden></div>
        </div>
        <div class="tonight" id="tonight" hidden>
          <form class="tonight-filters" id="tonight-filters" aria-label="Eingrenzen">
            <div class="tonight-head">
              <p class="tonight-kicker">Was passt heute?</p>
              <p class="tonight-count" id="tonight-count" aria-live="polite"></p>
            </div>
            <div class="tonight-group">
              <label class="tonight-kicker" for="tonight-runtime">Zeit</label>
              <input type="range" id="tonight-runtime" class="tonight-range" min="60" max="240" step="10" value="240" aria-describedby="tonight-runtime-label">
              <p class="tonight-range-label" id="tonight-runtime-label"></p>
            </div>
            <fieldset class="tonight-group" id="tonight-kind"><legend class="tonight-kicker">Art</legend><div class="tonight-chips"></div></fieldset>
            <fieldset class="tonight-group" id="tonight-medium"><legend class="tonight-kicker">Medium</legend><div class="tonight-chips"></div></fieldset>
            <div class="tonight-group">
              <label class="tonight-kicker" for="tonight-genre">Genre</label>
              <select id="tonight-genre" class="tonight-select"></select>
            </div>
            <button type="button" class="tonight-toggle" id="tonight-unseen" aria-pressed="true"><i aria-hidden="true"></i>Nur, was noch nicht gesehen ist</button>
          </form>
          <section class="tonight-stage" aria-labelledby="tonight-title">
            <div class="tonight-top">
              <div>
                <p class="tonight-kicker">Was schaue ich heute?</p>
                <h2 class="tonight-title" id="tonight-title">Heute Abend läuft …</h2>
              </div>
              <button class="button" type="button" id="tonight-draw"></button>
            </div>
            <div class="tonight-reel" id="tonight-reel" aria-hidden="true" hidden></div>
            <div class="tonight-result" id="tonight-result" aria-live="polite"></div>
          </section>
        </div>
      </section>

      <!-- „Dein Filmjahr": Jahresrückblick in Karten (js/ui/film-year.js) -->
      <section id="year-panel" class="fy-panel" role="tabpanel" aria-labelledby="tab-year" hidden tabindex="-1"></section>

      <!-- „Du gegen IMDb": eigene Note gegen IMDb-Wertung (js/ui/duel.js) - Suche und Filter wirken mit -->
      <section id="duel-panel" class="duel-panel" role="tabpanel" aria-labelledby="tab-duel" hidden tabindex="-1"></section>
    </main>

    <div id="modal-root"></div>
    <script type="module" src="js/views/movies-view.js"></script>
  </body>
</html>
