<!doctype html>
<html lang="de" data-site>
  <head>
    <meta charset="utf-8">
    <meta name="generator" content="Dashboard 2.39.0 (npm run build:site)">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Titel · Meine Kinothek</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <script src="js/site/boot.js" data-gate></script>
    <!-- Cover-Flug: Bild vor dem ersten Zeichnen in den Rahmen setzen (js/cover-flight.js) -->
    <link rel="expect" href="#detail-cover" blocking="render">
    <script src="js/cover-flight.js"></script>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/link-transition.css">
    <link rel="stylesheet" href="css/site.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Zum Inhalt springen</a>

    <header class="appbar">
      <div class="appbar-inner">
        <a class="brand brand--medallion" href="index.html" aria-label="Meine Kinothek – Startseite">
          <img src="assets/logo.svg" alt="" width="150" height="150" decoding="async">
          <span class="brand-fallback" aria-hidden="true">Meine Kinothek</span>
        </a>
        <div class="appbar-actions">
          <label class="visually-hidden" for="theme-select">Design</label>
          <select id="theme-select" class="compact">
            <option value="system">System</option>
            <option value="light">Hell</option>
            <option value="dark">Dunkel</option>
          </select>
          <a class="button quiet" href="index.html" id="back-link">Zur Kinothek</a>
          <button class="button quiet" id="view-button" type="button">Ansicht</button>
        </div>
      </div>
    </header>

    <main class="shell" id="main">
      <div class="page-head">
        <h1 id="movie-title" data-cover-title>Wird geladen …</h1>
      </div>
      <!-- Cover-Rahmen steht schon im HTML: Landeplatz für den Cover-Flug (js/cover-flight.js) -->
      <div class="detail-layout" id="detail-layout">
        <div class="detail-cover" id="detail-cover-column">
          <div class="movie-card-cover" id="detail-cover" data-cover-landing></div>
        </div>
        <div class="detail-main" id="movie-details" aria-live="polite"></div>
      </div>
      <section class="detail-similar" id="detail-similar" aria-labelledby="similar-title" hidden></section>
      <nav class="detail-pager" id="detail-pager" aria-label="Blättern" hidden>
        <a class="small-button" id="prev-title" rel="prev">← Vorheriger Titel</a>
        <a class="small-button" id="next-title" rel="next">Nächster Titel →</a>
      </nav>
    </main>

    <div id="modal-root"></div>
    <script type="module" src="js/views/movie-detail.js"></script>
  </body>
</html>
